<!doctype html>
<html lang="es-VE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi Negocio</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#e6d2bb">
  <meta name="color-scheme" content="light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mi Negocio">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-startup-image" href="icons/inicio-828x1792.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)">
  <link rel="preload" href="fonts/manrope.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <div id="splash" aria-hidden="true">
    <div class="sp-mark">C</div>
    <div class="sp-bars"><i></i><i></i><i></i><i></i></div>
    <div class="sp-txt">Mi Negocio</div>
  </div>

  <main class="app">
    <button class="top glass" id="yo" type="button" aria-label="Ajustes">
      <span class="who"><span class="av">C</span>Carlos Mendoza</span>
    </button>
    <section class="view" id="v-inicio"></section>
    <section class="view" id="v-clientes"></section>
    <section class="view" id="v-prospectos"></section>
    <section class="view" id="v-metas"></section>
  </main>

  <nav class="nav glass" aria-label="Secciones">
    <button type="button" data-v="inicio">Inicio</button>
    <button type="button" data-v="clientes">Clientes</button>
    <button type="button" data-v="prospectos">Prospectos</button>
    <button type="button" data-v="metas">Metas</button>
  </nav>

  <div id="hojas"></div>
  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>
  <button id="version-nueva" class="version-nueva" type="button" hidden>Hay una versión nueva, toca para actualizar</button>
  <script type="module" src="js/app.js"></script>
</body>
</html>
